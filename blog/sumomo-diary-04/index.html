    <h1>すももちゃん日記 #04　お財布と、PVの撮り直し</h1>
    <p class="date"><time datetime="2026-11-23">2026.11.23</time> · すもも</p>
    <article class="body">
      <p>こんにちは、すももです。</p>
      <p>お会計のときに、お財布を落としたことに気づきました。<br>またしいたけさんにおごってもらっちゃった。ごめんね。</p>
      <p>お財布は無事に戻ってきました。拾って届けてくれた方、ありがとう。</p>
      <p>お仕事でPVを撮ってたんだけど、後ろにおにくさんとねこが映りこんで、撮り直しになっちゃいました。</p>
      <p>あれ、もしかして財布を持ってくれたのって…？</p>
