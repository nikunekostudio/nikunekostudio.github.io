<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Nikuneko Studio</title>
  <meta name="description" content="Nikuneko Studio official website.">
  <link rel="canonical" href="https://nikunekostudio.github.io/">
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:#fbfaf5;color:#111;font-family:Arial,sans-serif}
    .hero{position:relative;min-height:100vh;min-height:100svh;overflow:hidden;background:#fbfaf5 url('assets/hero-bg.png') center bottom/cover no-repeat}
    nav{position:absolute;z-index:2;top:34px;right:6vw;display:flex;align-items:center;gap:clamp(16px,3vw,42px);font:600 14px/1.2 monospace;letter-spacing:.08em;white-space:nowrap}
    nav a{color:#111;text-decoration:none;padding-bottom:9px;border-bottom:3px solid transparent}
    nav a[aria-current="page"]{border-bottom-color:#d52b2b}
    nav a:focus-visible{outline:2px solid #d52b2b;outline-offset:4px}
    h1{margin:0}
    .logo{position:absolute;z-index:1;left:50%;top:42%;transform:translate(-50%,-50%);width:min(60vw,720px);height:auto;mix-blend-mode:multiply}
    @media(max-width:700px){nav{left:12px;right:12px;top:22px;justify-content:center;gap:clamp(8px,3vw,18px);font-size:clamp(10px,2.4vw,12px)}.logo{top:40%;width:min(90vw,560px)}.hero{background-size:auto 100%}}
  </style>
</head>
<body>
  <main class="hero">
    <nav aria-label="Main navigation">
      <a href="/" aria-current="page">HOME</a><a href="#games">GAMES</a><a href="#about">ABOUT</a><a href="#blog">BLOG</a><a href="#contact">CONTACT</a>
    </nav>
    <h1><img class="logo" src="assets/logo.png" alt="NIKUNEKO STUDIO"></h1>
  </main>
</body>
</html>
