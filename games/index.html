<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ゲーム一覧 | にくねこスタジオ</title>
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
  <meta name="description" content="にくねこスタジオのゲーム一覧。『飛べ！おにく！』『走れ！おにく！』をブラウザで遊べます。">
  <link rel="canonical" href="https://nikunekostudio.github.io/games/">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="ja_JP">
  <meta property="og:site_name" content="にくねこスタジオ">
  <meta property="og:title" content="ゲーム一覧 | にくねこスタジオ">
  <meta property="og:description" content="にくねこスタジオのゲームを遊ぼう。">
  <meta property="og:url" content="https://nikunekostudio.github.io/games/">
  <meta property="og:image" content="https://nikunekostudio.github.io/assets/tobe-oniku-preview.png">
  <meta property="og:image:alt" content="飛べ！おにく！のタイトル画面">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="theme-color" content="#100e26">
  <style>
    :root{color-scheme:dark}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;color:#f9f6ff;font-family:Arial,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif}
    body{background-color:#100e26;background-image:linear-gradient(180deg,rgba(9,8,30,.3),rgba(9,8,30,.57) 64%,rgba(9,8,30,.8)),url('../assets/arcade-bg.webp');background-position:center center;background-size:cover;background-attachment:fixed;background-repeat:no-repeat}
    a{color:inherit}
    a:focus-visible{outline:2px solid #77eaff;outline-offset:4px}
    .page-header{position:relative;min-height:250px;padding:28px max(24px,calc((100vw - 1040px)/2))}
    .topbar{display:flex;align-items:start;justify-content:space-between;gap:20px}
    .brand{display:inline-block;width:150px;height:76px;overflow:hidden;border-radius:6px;background:#fbfaf5}
    .brand img{display:block;width:150px;height:150px;transform:translateY(-37px)}
    nav{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:clamp(10px,2vw,28px);font:600 13px/1.5 monospace;letter-spacing:.05em}
    nav a{text-decoration:none;padding:5px 0;border-bottom:3px solid transparent}
    nav a[aria-current="page"],nav a:hover{border-bottom-color:#ff79de}
    .page-title{position:relative;z-index:1;margin:30px 0 0;font:800 clamp(46px,8vw,78px)/1 monospace;letter-spacing:.06em;text-shadow:3px 3px 0 #462b8a}
    .page-title small{display:block;margin-top:12px;font:700 15px/1.5 Arial,sans-serif;letter-spacing:0;text-shadow:none}
    main{max-width:1040px;margin:0 auto;padding:36px 24px 90px}
    .section-heading{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:25px}
    .section-heading h2{margin:0;font:700 21px/1.3 monospace;letter-spacing:.08em}
    .section-heading p{margin:0;color:#d9d3e8;font-size:14px}
    .game-list{display:grid;gap:26px}
    .game-card{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(270px,.9fr);overflow:hidden;border:1px solid #7d70ba;border-radius:12px;background:#15142ae8;box-shadow:0 16px 50px #06051b99,5px 5px 0 #a847af66}
    .game-art{background:#125db7}
    .game-art img{display:block;width:100%;height:100%;object-fit:contain;aspect-ratio:712/648}
    .game-art.run{display:grid;place-items:center;overflow:hidden;background:linear-gradient(#72ceff 0 62%,#f2c955 62%)}
    .game-art.run img{width:58%;height:auto;filter:drop-shadow(0 10px 0 #945c3633)}
    .game-info{display:flex;flex-direction:column;align-items:start;justify-content:center;padding:36px}
    .game-info .status{margin:0 0 12px;padding:5px 9px;border:1px solid #4994a5;background:#12313e;color:#a8f5ff;font:700 12px/1.4 monospace}
    .game-info h3{margin:0 0 16px;font-size:clamp(25px,3vw,35px)}
    .game-info p{margin:0 0 28px;line-height:1.9}
    .button{display:inline-block;padding:12px 18px;border:1px solid #ffd35a;border-radius:5px;background:#ffe17e;color:#181424;text-decoration:none;font-weight:700;box-shadow:4px 4px 0 #9a4388}
    .button:hover{background:#fff2b7}
    .monthly{margin-top:48px;padding:24px;border:1px solid #7d70ba;border-radius:12px;background:#15142aeb}
    .monthly h2{margin:0 0 8px;font-size:22px}
    .monthly p{margin:0 0 16px;line-height:1.7;color:#ddd6ec}
    .monthly ol{margin:0;padding-left:2.5em}
    .monthly li{padding:8px 3px;border-top:1px solid #5d5374}
    .monthly li span{float:right;font-weight:700;color:#ffe17e}
    .more{display:flex;align-items:center;gap:14px;margin-top:48px;padding-top:28px;border-top:1px solid #81739a;color:#e0d9eb}
    .more img{width:70px;height:70px;object-fit:contain;image-rendering:pixelated;border-radius:5px;background:#fff}
    .more p{margin:0;line-height:1.7}
    footer{padding:25px 24px 38px;text-align:center;font-size:13px}
    @media(max-width:700px){
      body{background-attachment:scroll;background-position:center top}
      .page-header{min-height:245px;padding:18px 18px 30px}
      .topbar{display:block}
      .brand{width:125px;height:65px}
      .brand img{width:125px;height:125px;transform:translateY(-30px)}
      nav{justify-content:flex-start;gap:8px 16px;margin-top:10px;font-size:11px}
      .page-title{margin-top:34px}
      main{padding:28px 20px 70px}
      .section-heading{display:block}
      .section-heading p{margin-top:8px}
      .game-card{grid-template-columns:1fr}
      .game-info{padding:27px}
    }
  </style>
</head>
<body>
  <header class="page-header">
    <div class="topbar">
      <a class="brand" href="../" aria-label="にくねこスタジオ ホーム"><img src="../assets/logo.png" alt="" width="1984" height="1984"></a>
      <nav aria-label="メインメニュー">
        <a href="../">HOME</a>
        <a href="./" aria-current="page">GAMES</a>
        <a href="https://suzuri.jp/nikuneko" target="_blank" rel="noopener noreferrer">SHOP</a>
        <a href="https://note.com/niku_kabu" target="_blank" rel="noopener noreferrer">NOTE</a>
        <a href="../#about">ABOUT</a>
        <a href="https://x.com/nikunekokikaku" target="_blank" rel="noopener noreferrer">CONTACT</a>
      </nav>
    </div>
    <h1 class="page-title">GAMES <small>にくねこスタジオのゲーム</small></h1>
  </header>

  <main>
    <div class="section-heading">
      <h2>公開中のゲーム</h2>
      <p>作品が増えたらここに追加していきます。</p>
    </div>
    <div class="game-list">
    <article class="game-card">
      <div class="game-art"><img src="../assets/tobe-oniku-preview.png" alt="飛べ！おにく！のタイトル画面" width="712" height="648"></div>
      <div class="game-info">
        <p class="status">PLAY IN BROWSER</p>
        <h3>飛べ！おにく！</h3>
        <p>おにくを飛ばして遊ぶ、ブラウザゲーム。</p>
        <a class="button" href="tobe-oniku/" aria-label="飛べ！おにく！をプレイ">ゲームで遊ぶ ↗</a>
      </div>
    </article>
    <article class="game-card">
      <div class="game-art run"><img src="hashire-oniku/oniku10.png" alt="走れ！おにく！の主人公、おにく" width="2048" height="2048"></div>
      <div class="game-info">
        <p class="status">PLAY IN BROWSER</p>
        <h3>走れ！おにく！</h3>
        <p>ジャンプとしゃがみで障害物をよけて走る、ブラウザゲーム。</p>
        <a class="button" href="hashire-oniku/" aria-label="走れ！おにく！をプレイ">ゲームで遊ぶ ↗</a>
      </div>
    </article>
    </div>
    <section class="monthly" aria-labelledby="monthly-heading">
      <h2 id="monthly-heading">今月のハイスコア</h2>
      <p id="monthly-status" role="status">ランキングは公開準備中です。</p>
      <ol id="monthly-list"></ol>
    </section>
    <div class="more">
      <img src="../assets/arukuneko.GIF" alt="" width="384" height="384" loading="lazy">
      <p>次のゲームも準備中。ときどきのぞきに来てくださいね。</p>
    </div>
  </main>
  <footer>© 2026 にくねこスタジオ · <a href="../">HOME</a></footer>
  <script src="../assets/monthly-config.js"></script>
  <script src="monthly-scores.js" defer></script>

</body>
</html>
