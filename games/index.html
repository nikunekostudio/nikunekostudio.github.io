<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ゲーム一覧 | にくねこスタジオ</title>
  <meta name="description" content="にくねこスタジオのゲーム一覧。『飛べ！おにく！』をブラウザで遊べます。">
  <link rel="canonical" href="https://nikunekostudio.github.io/games/">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="ja_JP">
  <meta property="og:site_name" content="にくねこスタジオ">
  <meta property="og:title" content="ゲーム一覧 | にくねこスタジオ">
  <meta property="og:description" content="にくねこスタジオのゲームを遊ぼう。">
  <meta property="og:url" content="https://nikunekostudio.github.io/games/">
  <meta property="og:image" content="https://nikunekostudio.github.io/assets/hero-bg.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="theme-color" content="#fbfaf5">
  <style>
    :root{color-scheme:light}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:#fbfaf5;color:#181817;font-family:Arial,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif}
    a{color:inherit}
    a:focus-visible{outline:2px solid #ca2528;outline-offset:4px}
    .page-header{position:relative;min-height:360px;padding:32px max(24px,calc((100vw - 1040px)/2));background:#fbfaf5 url('../assets/hero-bg.png') center bottom/cover no-repeat}
    .topbar{display:flex;align-items:start;justify-content:space-between;gap:20px}
    .brand{display:inline-block;width:170px;height:90px;overflow:hidden}
    .brand img{display:block;width:170px;height:170px;transform:translateY(-41px);mix-blend-mode:multiply}
    nav{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:clamp(10px,2vw,28px);font:600 13px/1.5 monospace;letter-spacing:.05em}
    nav a{text-decoration:none;padding:5px 0;border-bottom:3px solid transparent}
    nav a[aria-current="page"],nav a:hover{border-bottom-color:#d52b2b}
    .page-title{position:relative;z-index:1;margin:50px 0 0;font:800 clamp(46px,8vw,86px)/1 monospace;letter-spacing:.06em;text-shadow:4px 4px #fff}
    .page-title small{display:block;margin-top:12px;font:700 15px/1.5 Arial,sans-serif;letter-spacing:0}
    main{max-width:1040px;margin:0 auto;padding:58px 24px 90px}
    .section-heading{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:25px}
    .section-heading h2{margin:0;font:700 21px/1.3 monospace;letter-spacing:.08em}
    .section-heading p{margin:0;color:#51514c;font-size:14px}
    .game-card{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(270px,.9fr);overflow:hidden;border:2px solid #242424;background:#fffefa;box-shadow:8px 8px 0 #dce8d6}
    .game-art{position:relative;display:flex;align-items:center;justify-content:center;min-height:340px;background:#dceeff url('../assets/hero-bg.png') center bottom/cover no-repeat}
    .game-art img{width:min(80%,310px);height:auto;image-rendering:pixelated;filter:drop-shadow(5px 7px 0 #40443a48)}
    .game-info{display:flex;flex-direction:column;align-items:start;justify-content:center;padding:36px}
    .game-info .status{margin:0 0 12px;padding:5px 9px;background:#eaf4df;font:700 12px/1.4 monospace}
    .game-info h3{margin:0 0 16px;font-size:clamp(25px,3vw,35px)}
    .game-info p{margin:0 0 28px;line-height:1.9}
    .button{display:inline-block;padding:12px 18px;border:2px solid #242424;background:#fff;color:#181817;text-decoration:none;font-weight:700;box-shadow:4px 4px 0 #d52b2b}
    .button:hover{background:#f8eaea}
    .more{display:flex;align-items:center;gap:14px;margin-top:48px;padding-top:28px;border-top:2px solid #242424;color:#42423e}
    .more img{width:70px;height:70px;object-fit:contain;image-rendering:pixelated;mix-blend-mode:multiply}
    .more p{margin:0;line-height:1.7}
    footer{padding:25px 24px 38px;text-align:center;font-size:13px}
    @media(max-width:700px){
      .page-header{min-height:320px;padding:18px 18px 35px;background-size:auto 100%}
      .topbar{display:block}
      .brand{width:125px;height:65px}
      .brand img{width:125px;height:125px;transform:translateY(-30px)}
      nav{justify-content:flex-start;gap:8px 16px;margin-top:10px;font-size:11px}
      .page-title{margin-top:40px}
      main{padding:45px 20px 70px}
      .section-heading{display:block}
      .section-heading p{margin-top:8px}
      .game-card{grid-template-columns:1fr}
      .game-art{min-height:265px}
      .game-art img{width:min(70%,250px)}
      .game-info{padding:27px}
    }
  </style>
</head>
<body>
  <header class="page-header">
    <div class="topbar">
      <a class="brand" href="../" aria-label="にくねこスタジオ ホーム"><img src="../assets/logo.png" alt="" width="1984" height="1984"></a>
      <nav aria-label="メインメニュー">
        <a href="../">HOME</a>
        <a href="./" aria-current="page">GAMES</a>
        <a href="https://suzuri.jp/nikuneko" target="_blank" rel="noopener noreferrer">SHOP</a>
        <a href="https://note.com/niku_kabu" target="_blank" rel="noopener noreferrer">NOTE</a>
        <a href="../#about">ABOUT</a>
        <a href="https://x.com/nikunekokikaku" target="_blank" rel="noopener noreferrer">CONTACT</a>
      </nav>
    </div>
    <h1 class="page-title">GAMES <small>にくねこスタジオのゲーム</small></h1>
  </header>

  <main>
    <div class="section-heading">
      <h2>公開中のゲーム</h2>
      <p>作品が増えたらここに追加していきます。</p>
    </div>
    <article class="game-card">
      <div class="game-art"><img src="../assets/oniku.png" alt="ゲームに登場するおにく" width="1280" height="1280"></div>
      <div class="game-info">
        <p class="status">PLAY IN BROWSER</p>
        <h3>飛べ！おにく！</h3>
        <p>おにくを飛ばして遊ぶ、ブラウザゲーム。</p>
        <a class="button" href="tobe-oniku/" aria-label="飛べ！おにく！をプレイ">ゲームで遊ぶ ↗</a>
      </div>
    </article>
    <div class="more">
      <img src="../assets/arukuneko.GIF" alt="" width="384" height="384" loading="lazy">
      <p>次のゲームも準備中。ときどきのぞきに来てくださいね。</p>
    </div>
  </main>
  <footer>© 2026 にくねこスタジオ · <a href="../">HOME</a></footer>

</body>
</html>
