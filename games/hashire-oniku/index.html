<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <title>走れ！おにく！ | にくねこスタジオ</title>
  <meta name="description" content="おにくをジャンプさせ、しいたけを撃って障害物を切り抜けるランゲーム。">
  <link rel="icon" type="image/svg+xml" href="../../favicon.svg">
  <meta name="theme-color" content="#b3d8f8">
  <style>
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#111;color:#fff;font-family:Arial,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;overscroll-behavior:none}
    body{display:grid;place-items:center;padding:max(8px,env(safe-area-inset-top)) max(8px,env(safe-area-inset-right)) max(8px,env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left))}
    .game-wrap{width:min(100%,960px)}.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 8px}.bar a{color:#fff;text-decoration:none;font-weight:700;font-size:14px}.bar button{border:1px solid #aaa;border-radius:5px;background:#272727;color:#fff;padding:7px 11px;font-weight:700;cursor:pointer}
    .stage{position:relative;overflow:hidden;border:2px solid #eee;background:#b3d8f8;box-shadow:0 8px 28px #000b;touch-action:none}canvas{display:block;width:100%;height:auto;aspect-ratio:16/9}
    .result-panel[hidden]{display:none}.result-panel{position:absolute;inset:8% 18% 7%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;text-shadow:0 2px 0 #fff;color:#241d18}.result-score{margin:0;font-size:clamp(28px,5vw,48px);font-weight:900}.result-best{margin:0 0 4px;font-size:clamp(16px,2.4vw,24px);font-weight:900;color:#8a3f22}.result-actions,.score-submit{display:flex;justify-content:center;flex-wrap:wrap;gap:8px}.result-panel button,.result-panel a{min-height:42px;padding:9px 16px;border:2px solid #fff;border-radius:7px;background:#333;color:#fff;font:800 15px/1 Arial,sans-serif;text-decoration:none;text-shadow:none;cursor:pointer;box-shadow:0 3px 0 #1118}.result-panel input{width:min(220px,45vw);min-height:42px;border:2px solid #fff;border-radius:7px;padding:8px 10px;font:700 15px Arial,sans-serif;color:#222;background:#fffffff2}.result-panel .share-x{background:#111}.result-panel .submit-score{background:#e84242}.score-status{min-height:18px;margin:0;font-size:13px;font-weight:800}.ranking-link{font-size:13px;background:#2875a8!important}
    .touch{display:none;grid-template-columns:1.35fr .65fr;gap:8px;margin-top:8px}.touch button{min-height:58px;border:2px solid #fff;border-radius:6px;background:#333;color:#fff;font-size:17px;font-weight:800;touch-action:none}.help{margin:9px 0 0;text-align:center;color:#bbb;font-size:13px;line-height:1.5}@media(max-width:760px){.touch{display:grid}.help{font-size:12px}}
  </style>
</head>
<body>
  <main class="game-wrap">
    <div class="bar"><a href="../">← ゲーム一覧</a><button id="sound" type="button" aria-pressed="false">♪ ON</button></div>
    <div class="stage">
      <canvas id="game" width="960" height="540" aria-label="走れ！おにく！ゲーム画面"></canvas>
      <section id="result-panel" class="result-panel" hidden aria-label="ゲーム結果">
        <p id="result-score" class="result-score"></p><p id="result-best" class="result-best"></p>
        <div class="result-actions"><button id="retry" type="button">もう一度</button><button id="back-title" type="button">タイトル</button><a id="share-x" class="share-x" target="_blank" rel="noopener noreferrer">Xで共有</a></div>
        <form id="score-form" class="score-submit"><input id="player-name" maxlength="20" autocomplete="nickname" placeholder="プレイヤー名" aria-label="プレイヤー名" required><button class="submit-score" type="submit">ハイスコア登録</button></form>
        <p id="score-status" class="score-status" aria-live="polite"></p>
        <a class="ranking-link" href="https://gd.games/games/ac233dc3-38ac-474f-8b1f-06808458696c/leaderboard/34dc470e-8c6e-43b6-8bb1-519c4429849e" target="_blank" rel="noopener noreferrer">走れ！ランキングを見る</a>
      </section>
    </div>
    <div class="touch" aria-label="タッチ操作"><button id="jump" type="button">↑ ジャンプ</button><button id="shoot" type="button">↓ しいたけ</button></div>
    <p class="help">↑ / Space：ジャンプ　　↓：しいたけを投げる　　タイトルではおにくを押してスタート</p>
  </main>
  <audio id="stage-bgm" src="stage.mp3" loop preload="auto"></audio><audio id="result-bgm" src="result.mp3" loop preload="auto"></audio><audio id="jump-sound" src="jump.mp3" preload="auto"></audio><audio id="coin-sound" src="gold.aac" preload="auto"></audio><audio id="dead-sound" src="dead.aac" preload="auto"></audio><audio id="hit-sound" src="impact.aac" preload="auto"></audio>
  <script src="game.js"></script>
</body>
</html>
