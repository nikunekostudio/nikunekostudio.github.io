<!doctype html>
<html lang="ja">
<head>
  <meta name="robots" content="noindex, follow">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>株の常識クイズ 初級編 | にくねこスタジオ</title>
  <meta name="description" content="倒産、配当、空売りなど、株式の基礎知識を学べる初級編・全20問の4択クイズ。">
  <link rel="canonical" href="https://nikuneko.com/games/quiz/beginner/">
  <link rel="icon" type="image/svg+xml" href="../../favicon.svg">
  <link rel="stylesheet" href="style.css">
  <script src="questions.js?v=20261015b" defer></script>
  <script src="game.js?v=20261015b" defer></script>
</head>
<body>
  <header><a href="../">← ゲーム一覧</a><span>QUIZ MINI GAME</span></header>
  <main>
    <section id="start" class="panel start">
      <p class="eyebrow">STOCK MARKET QUIZ · BEGINNER</p>
      <h1>株の常識<br><em>クイズ 初級編</em></h1>
      <div class="mascot" aria-hidden="true">?</div>
      <p class="lead">あなたは何問わかる？ 株の知識を4択でチェック！</p>
      <p id="question-count" class="note"></p>
      <button id="start-button" class="primary" type="button">クイズスタート</button>
    </section>

    <section id="quiz" class="panel quiz" hidden>
      <div class="status"><span id="progress-text">QUESTION 1 / 3</span><span id="score-text">SCORE 0</span></div>
      <div class="progress"><span id="progress-bar"></span></div>
      <p id="category" class="category"></p>
      <h2 id="question"></h2>
      <div id="choices" class="choices"></div>
      <div id="feedback" class="feedback" hidden aria-live="polite">
        <strong id="feedback-title"></strong>
        <p id="explanation"></p>
        <button id="next-button" class="primary" type="button">次の問題へ</button>
      </div>
    </section>

    <section id="result" class="panel result" hidden>
      <p class="eyebrow">QUIZ COMPLETE</p>
      <h1>RESULT</h1>
      <div class="result-score"><strong id="result-score">0 / 3</strong><span id="result-percent">0%</span></div>
      <h2 id="result-title"></h2>
      <p id="result-message"></p>
      <div class="actions"><button id="retry-button" class="primary" type="button">もう一度挑戦</button><a id="share-button" class="share" target="_blank" rel="noopener noreferrer">Xで結果を共有</a></div>
    </section>
  </main>
  <footer>© 2026 にくねこスタジオ · <a href="../../terms/">利用規約</a> · <a href="../../privacy/">プライバシーポリシー</a></footer>
  <script src="../../i18n.js"></script>
</body>
</html>
