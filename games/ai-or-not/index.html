<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>AI or NOT? | にくねこスタジオ</title>
  <meta name="description" content="その画像はAI？それとも人の手で作られた画像？10問の画像クイズに挑戦しよう。">
  <link rel="canonical" href="https://nikunekostudio.github.io/games/ai-or-not/">
  <link rel="icon" type="image/svg+xml" href="../../favicon.svg">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="ja_JP">
  <meta property="og:site_name" content="にくねこスタジオ">
  <meta property="og:title" content="AI or NOT? | にくねこスタジオ">
  <meta property="og:description" content="キミはAI画像を見破れるか？全10問の画像クイズ。">
  <meta property="og:url" content="https://nikunekostudio.github.io/games/ai-or-not/">
  <meta property="og:image" content="https://nikunekostudio.github.io/games/ai-or-not/thumbnail.svg">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="theme-color" content="#130b2b">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <a href="../../" class="brand" aria-label="にくねこスタジオ ホーム"><img src="../../assets/logo.png" alt="" width="1984" height="1984"></a>
    <a class="back" href="../">← ゲーム一覧</a>
  </header>

  <main class="game-shell">
    <section id="start-screen" class="screen start-screen">
      <p class="eyebrow">IMAGE QUIZ · 10 QUESTIONS</p>
      <h1><span>AI</span> or <span>NOT?</span></h1>
      <p class="lead">キミはAI画像を<br class="mobile-only">見破れるか？</p>
      <div class="start-visual" aria-hidden="true">
        <span class="scan"></span><span class="eye">◉</span><span class="noise">010101<br>101010</span>
      </div>
      <p class="rule">表示される画像が「AI画像」か「AIじゃない」かを選ぼう。全10問、回答後に正解がわかります。</p>
      <button id="start-button" class="primary" type="button">鑑定スタート</button>
    </section>

    <section id="quiz-screen" class="screen quiz-screen" hidden>
      <div class="quiz-head">
        <p id="progress-text">QUESTION 1 / 10</p>
        <p id="score-text">SCORE 0</p>
      </div>
      <div class="progress" aria-hidden="true"><span id="progress-bar"></span></div>
      <figure class="image-frame">
        <img id="quiz-image" src="" alt="AI画像かどうかを判定する画像">
        <span class="corner corner-a"></span><span class="corner corner-b"></span>
        <span class="corner corner-c"></span><span class="corner corner-d"></span>
      </figure>
      <p class="question">この画像はAIで作られている？</p>
      <div id="answer-buttons" class="answers">
        <button type="button" data-answer="ai"><small>GENERATED</small>AI画像</button>
        <button type="button" data-answer="human"><small>NOT GENERATED</small>AIじゃない</button>
      </div>
      <div id="feedback" class="feedback" hidden aria-live="polite">
        <p id="feedback-mark" class="feedback-mark"></p>
        <h2 id="feedback-title"></h2>
        <p id="feedback-copy"></p>
        <button id="next-button" class="primary" type="button">次の画像へ</button>
      </div>
    </section>

    <section id="result-screen" class="screen result-screen" hidden>
      <p class="eyebrow">ANALYSIS COMPLETE</p>
      <h1>RESULT</h1>
      <div class="result-ring" aria-label="正解率">
        <strong id="result-percent">0%</strong>
        <span id="result-score">0 / 10</span>
      </div>
      <h2 id="result-rank"></h2>
      <p id="result-message"></p>
      <div class="result-actions">
        <button id="retry-button" class="primary" type="button">もう一度挑戦</button>
        <a id="share-button" class="share" href="#" target="_blank" rel="noopener noreferrer">Xで結果を共有</a>
      </div>
      <a class="text-link" href="../">ゲーム一覧へ戻る</a>
    </section>
  </main>
  <footer>© 2026 にくねこスタジオ<br><small>使用画像の権利は各権利者に帰属します。</small></footer>
  <script src="game.js" defer></script>
  <!-- Cloudflare Web Analytics -->
  <script type="module" src="https://static.cloudflareinsights.com/beacon.min.js" data-cf-beacon='{"token":"b0ebae13abad4e738176a8c4336b03ff"}'></script>
  <!-- End Cloudflare Web Analytics -->
</body>
</html>
